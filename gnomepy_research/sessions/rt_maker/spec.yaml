# DRAFT written by Claude on 2026-11-12 for review - spec.yaml is user-authored, so edit freely.
name: rt_maker
description: >
  A resting maker on a film's Kalshi Rotten Tomatoes "at least X" strikes, for Kalshi's liquidity rewards. One session
  per film; on every strike with a reward program in force it rests 500 contracts at the best bid and best ask other
  makers show, stops a side at 500 contracts held or sold, and keeps the film's money committed under $10k. After a
  review of the film (rt_reviews), signal_mode pull pulls every quote for 30 minutes; signal_mode skew quotes only the
  side Claude's fresh-share signal picks, until the next review, pulling both only when a review gives no side or flips
  it. A change in the Tomatometer's count (rt_scores) pulls every quote for 30 minutes in both.

goals:
  primary_metric: final_pnl
  direction: maximize
  thresholds:
    final_pnl: ">0"
    fill_count: ">0"

constraints:
  strategy_type: market_making
  avoid:
    - taking liquidity - quotes only
    - quoting within pull_minutes of a review (pull mode; in skew mode, of a review without a side or that flips it) or a Tomatometer change
    - quoting the side against the review signal while it has a side (skew mode)
    - quoting a strike without a reward program in force
    - more than max_position held or sold on one strike, or max_film_usd committed on the film
    - staying alone at a level other makers have left (live books show our own orders; paper sets own_orders_in_book false)
  notes:
    - The real-books replay (~/gnome-research-work/rt/lip/maker_guard_books.py) first showed pull 30 at +$2.6k/day, but it read each trade against the book from its own millisecond, already showing the trade, and so missed the fills that clear a level. Fixed (2026-11-13), pull 30 is -$0.9k/day at the front of the queue and +$0.5k at the back, with 1 h markouts near -2c; the trades-only replay's -1.7c (maker_guard.py) was not too harsh after all
    - "Trades-only replay over 62 settled films, Apr-Nov 2026 (~/gnome-research-work/rt/outlets/maker_skew.py, held to settlement, Q500): pull 30 nets -$35k; skew with no time limit +$5k, +$40k paired (+5.8 se, better on 32 films, worse on 7). Half of it is from not quoting both sides after the wave (going dark: +$20k), half from the side the signal picks (the opposite side: +$6k, +0.95 se). A 1 h skew gains only +$1k (+1.0 se)"
    - gnome-backtest (gnome-simulation with trade/book pairing) fills on stale quotes the book crosses (13-16% of fills), which a public-trades replay can't see; its fills sit between the fixed replay's front and back bounds
    - Rewards are Kalshi's LIP for US members (the founder's individual account); Kalshi's stated end of the program is 2027-01-01
    - Settlement check due Nov 16 (Ebenezer, How to Rob a Bank, Victorian Psycho, Ghost Soldier)

meta:
  execution_mode: local
  interaction_mode: interactive
