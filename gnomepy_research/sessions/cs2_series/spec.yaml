# DRAFT written by Claude on 2026-10-15 for review - spec.yaml is user-authored, so edit freely.
name: cs2_series
description: >
  CS2 series winner (BO3) in the last hour before kickoff, one session per HLTV match holding
  every venue's listings: Polymarket International, Kalshi and Polymarket US. The session prices
  the announced fives with e12-wide-mm (the weekly cs2_e12_fit artifact) and blends that with the
  market's own mid (the cs2_e12_blend weights). It buys whichever listing is underpriced by at
  least the threshold after its taker fee, sized by fractional Kelly on the bankroll and capped
  at max_stake_usd per match across venues, holding to settlement. When the model's price
  changes (a lineup or stand-in change) it sells what it holds into bids that beat the new fair
  price by the threshold, and may then take the other side.

goals:
  primary_metric: final_pnl
  direction: maximize
  thresholds:
    final_pnl: ">0"
    fill_count: ">0"

constraints:
  strategy_type: directional
  avoid:
    - trading before both lineups are announced
    - trading on a model fitted more than max_model_age_days ago, or after the moment being priced
    - trading outside the last hour before HLTV's latest kickoff, or once HLTV lists the match live or drops it
    - running past kickoff - the session ends there keeping its positions, which settle in the ledger unmarked
    - in-play trading - the model knows nothing about the score
    - holding both teams in one match
    - selling on a market move alone - only a change in the model's price allows a sale
    - selling unless the proceeds after the fee beat the current fair price by min_edge
    - holding more than the Kelly size at the current price, or more than max_stake_usd per match
  notes:
    - Model (Nov 2026) - e12-wide-mm, e12 plus 0.406 x the FACEIT matchmaking-skill gap of the announced fives, replaced the XGB pre-veto + Bayesian series blend
    - The fair price is fitted on kickoff prices only, so the session trades the last hour; 12h-out comparisons carry lineup lookahead and say nothing about this window
    - Mid from Polymarket International when it has a two-sided book (the blend was fitted on its prices), else the tightest two-sided book on another venue
    - November 2026 is pre-registered as a test of the blend (Test 2, scored in December); paper trading runs alongside it
    - Capacity (prod cs2_upcoming_books, Oct 21) - when a side clears 5c at the best ask, the median $ still clearing it is ~$1,750 on PM Intl, ~$615 Kalshi, ~$500 PM US; one session across venues reaches all of it under the single $250 cap
    - The price band and adverse-move stop of the XGB-era strategy are gone; judge whether long shots or late moves need them again from paper fills
    - Map 1 and map 2 are a separate session (cs2_maps), not traded here

meta:
  execution_mode: local
  interaction_mode: interactive
