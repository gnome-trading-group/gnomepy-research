name: stablecoin_stat_arb
description: >
  Statistical arbitrage between two stablecoin listings: trade the z-score of their spread
  against a time-decayed EWMA mean, entering at entry_z, closing at close_z and stopping out
  at stop_z.

  Reconstructed 2026-10-19 from the session's only config (bugfix_test.yaml); the session
  ran without a spec.yaml and was never iterated by /research.

data:
  listings:
    - listing_id: 1
    - listing_id: 28
  date_ranges:
    - start: "2026-05-13T00:00:00"
      end: "2026-05-16T00:00:00"

goals:
  primary_metric: final_pnl
  direction: maximize
  thresholds:
    final_pnl: ">0"
    fill_count: ">0"

constraints:
  strategy_type: arb
  max_iterations: 20

meta:
  execution_mode: local
  sensitivity_tests:
    latency: true
    queue_model: true
  interaction_mode: autonomous
