name: informed_pmm
description: >
  Multi-venue informed market making on binary prediction market contracts.
  Uses a reference venue (Polymarket, deeper liquidity) as a Kalman-smoothed
  microprice signal and quotes HJB-optimal spreads on a quoting venue (Kalshi).
  Reduces adverse selection by anchoring to the cross-venue fair value rather
  than the quoting venue's local book mid.

data:
  listings:
    - listing_id: 129651
      profile: kalshi
    - listing_id: 130435
      profile: polymarket
  date_ranges:
    - start: "2026-08-19T14:30:00"
      end: "2026-08-19T14:48:00"

profiles:
  polymarket:
    fee_model:
      type: parametric
      taker_fee_rate: 0.07
      maker_fee_rate: 0.0
    network_latency:
      type: static
      latency_nanos: 50000000
    order_processing_latency:
      type: maker_taker
      base_nanos: 5000000
      taker_delay_nanos: 250000000
      maker_delay_nanos: 0
    queue_model:
      type: risk_averse
  kalshi:
    fee_model:
      type: parametric
      taker_fee_rate: 0.07
      maker_fee_rate: 0.0175
    network_latency:
      type: static
      latency_nanos: 50000000
    order_processing_latency:
      type: maker_taker
      base_nanos: 5000000
      taker_delay_nanos: 250000000
      maker_delay_nanos: 0
    queue_model:
      type: risk_averse

goals:
  primary_metric: final_pnl
  direction: maximize
  thresholds:
    final_pnl: ">0"
    fill_count: ">0"
  targets:
    sharpe: ">1.0"

constraints:
  strategy_type: market_maker
  max_iterations: 20
  avoid:
    - quoting when reference data is stale
    - letting quotes cross after fee adjustment

meta:
  execution_mode: local
  sensitivity_tests:
    latency: true
    queue_model: true
  interaction_mode: autonomous
