# Iteration 1: initial calibration on a single tier-2 CS2 match.
# Replace listing_id_yes/no with real IDs from the security master.
# Replace fair_value_series_path with a pre-computed parquet from GRID/demo data.

strategy:
  class_name: "gnomepy_research.sessions.cs2_win_probability.cs2_win_probability:CS2WinProbability"
  args:
    listing_id_yes: 253844       # Polymarket YES for this match (example)
    listing_id_no: 253845        # Polymarket NO for this match
    model_path: "artifact://xgboost_model/cs2_round_win_prob"
    level: "map"
    ct_team_is_team_a: true
    ct_score: 0
    t_score: 0
    fair_value_series_path: null  # set to parquet path once model + GRID data are ready
    edge_threshold: 0.03
    half_spread: 0.02
    max_position: 100
    maker_size: 10
    max_book_spread_pct: 0.10
    processing_time_ns: 5000000

record_depth: 1

# Replace with actual match time window
start_date: "2026-01-01T12:00:00"
end_date: "2026-01-01T14:00:00"

listings:
  - listing_id: 253844
    profile: polymarket
  - listing_id: 253845
    profile: polymarket

profiles:
  polymarket:
    fee_model:
      type: parametric
      taker_fee_rate: 0.07
      maker_fee_rate: 0.0
    network_latency:
      type: static
      latency_nanos: 50000000
    order_processing_latency:
      type: maker_taker
      base_nanos: 5000000
      taker_delay_nanos: 250000000
      maker_delay_nanos: 0
    queue_model:
      type: risk_averse
