strategy:
  class_name: "gnomepy_research.sessions.cross_prediction_arb.cross_prediction_arb:CrossPredictionArb"
  args:
    pm_a_listing_id: 0
    pm_b_listing_id: 0
    k_a_listing_id: 0
    k_b_listing_id: 0
    max_position: 2000
    min_edge_cents: 1.0
    min_contract_price: 0.10
    max_price_divergence_cents: 5.0
    imbalance_timeout_ns: 60000000000
    max_staleness_ns: 60000000000
    processing_time_ns: 5000000
    fill_risk_lambda: 0.0
    unwind_spread_mult: 2.0
    depth_coverage_mult: 0.0
    use_cst_fill_model: false
    price_window_cents: 2
    price_model: "join_best_bid"
    price_improve_bps: 50.0
    price_edge_share: 0.5
    target_fill_prob: 0.7
    optimal_ev_lambda: 30.0
    pm_taker_mode: true
    allow_dutch_book: false
    gamma_T: 0.0
    resolution_time_ns: 0
    track_markouts: false
    debug: true

record_depth: 10

profiles:
  polymarket:
    fee_model:
      type: parametric
      taker_fee_rate: 0.07
      maker_fee_rate: 0.0
    network_latency:
