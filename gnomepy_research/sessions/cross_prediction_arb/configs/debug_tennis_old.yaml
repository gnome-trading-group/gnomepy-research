    order_processing_latency:
      type: maker_taker
      base_nanos: 5000000
      taker_delay_nanos: 50000000
      maker_delay_nanos: 0
    queue_model:
      type: risk_averse
  kalshi:
    fee_model:
      type: parametric
      taker_fee_rate: 0.07
      maker_fee_rate: 0.0175
