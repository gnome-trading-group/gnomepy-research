[tool.poetry]
name = "gnomepy-research"
version = "1.0.0"
description = "Signal research, replay, metrics, and strategy modules for gnomepy"
authors = ["mprey <masonprey7@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
gnomepy = {version = "^2.25.2", extras = ["backtest", "live-data"]}
joblib = "^1.6.0"
scikit-learn = "^1.9.1"
xgboost = "^3.4.1"
pymc = "^6.3.2"
nutpie = "^0.16.11"
numba = ">=0.61,<0.68"
catboost = "^1.2.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
notebook = "^7.5.5"

[tool.poetry.scripts]
research = "gnomepy_research.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
